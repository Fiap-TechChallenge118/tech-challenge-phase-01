[project]
name = "churn-mlp"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "torch>=2.2",
    "scikit-learn>=1.4",
    "mlflow>=2.12",
    "fastapi>=0.111",
    "uvicorn[standard]>=0.29",
    "pydantic>=2.6",
    "pandas>=2.2",
    "numpy>=1.26",
    "pandera>=0.19",
    "joblib>=1.4",
    "httpx>=0.27",
    "boto3>=1.34",
    "mangum>=0.17",
    "ipykernel>=7.2.0",
    "seaborn>=0.13",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.1",
    "pytest-cov>=5.0",
    "ruff>=0.4",
]

[tool.ruff]
target-version = "py311"
line-length = 120
exclude = ["notebooks/"]

[tool.ruff.lint]
select = ["E", "F", "W", "I"]

[tool.pytest.ini_options]
testpaths    = ["tests"]
pythonpath   = ["."]
addopts      = "-v --tb=short --cov=src --cov=api --cov-report=term-missing --cov-fail-under=80"
markers      = [
    "slow: testes que levam mais de 5s (ex: treino completo)",
    "integration: testes que dependem de artefatos externos (modelo treinado, CSV)",
]
filterwarnings = [
    "ignore::FutureWarning:pandera",
    "ignore::DeprecationWarning:mlflow",
]

[tool.coverage.run]
omit = [
    "src/train.py",
    "src/pipeline.py",
    "src/batch_predict.py",
]

[tool.coverage.report]
exclude_lines = [
    "if __name__ == .__main__.:",
]
